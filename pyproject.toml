[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provia"
version = "1.0.0"
description = "PROVIA: procedure state tracking for online mistake detection in egocentric video"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "torch>=2.2", "scikit-learn>=1.3", "safetensors>=0.4", "decord>=0.6.0"]

[project.optional-dependencies]
features = ["opencv-python>=4.9", "ultralytics>=8.2", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
provia = "provia.launch:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["provia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
